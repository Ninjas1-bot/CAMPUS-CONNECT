<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title th:text="${title}">Announcement</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { display:flex; align-items:center; justify-content:center; height:100vh; background: linear-gradient(135deg,#f6f9fc,#e9f0ff); font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial; }
    .announce-card { background:white; padding:2rem; border-radius:12px; box-shadow: 0 8px 20px rgba(30,60,120,0.08); text-align:center; max-width:540px; }
    .pulse { display:inline-block; padding:0.5rem 1rem; border-radius:999px; background: linear-gradient(90deg,#ff7a7a,#ffb199); color:white; font-weight:600; transform-origin:center; animation: pulse 1.6s ease-in-out infinite; }
    @keyframes pulse { 0% { transform: scale(1); box-shadow:0 0 0 rgba(255,122,122,0.4);} 50% { transform: scale(1.05); box-shadow:0 10px 30px rgba(255,122,122,0.12);} 100% { transform: scale(1); box-shadow:0 0 0 rgba(255,122,122,0);} }
    .muted { color:#6c757d; }
    .cta { margin-top:1rem; }
  </style>
</head>
<body>
  <div class="announce-card">
    <div class="pulse" th:text="${title}">Semester Registration Ending Soon</div>
    <p class="mt-3 muted" th:text="${message}">Registration closes soon, please register.</p>
    <div class="cta">
      <a th:href="${ctaLink}" class="btn btn-primary me-2" th:text="${ctaText}">Go to Registration</a>
      <a href="/dashboard" class="btn btn-outline-secondary">Back to Dashboard</a>
    </div>
  </div>
</body>
</html>
