<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Campus Connect - Student Portal</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container vh-100 d-flex align-items-center justify-content-center">
  <div class="card shadow-lg p-4" style="width: 22rem;">
    <h3 class="text-center mb-4 text-primary">Campus Connect</h3>

    <form method="post" action="/login">
      <div class="mb-3">
        <label>Email</label>
        <input type="text" class="form-control" name="email" required>
      </div>
      <div class="mb-3">
        <label>Password</label>
        <input type="password" class="form-control" name="password" required>
      </div>
      <button class="btn btn-primary w-100">Login</button>
    </form>

    <p th:if="${error}" class="text-danger text-center mt-3">[[${error}]]</p>
    <p class="text-muted text-center mt-4 small">Student demo: <b>test@example.com</b> / <b>123</b><br/>Teacher demo (view-only in this build): <b>teacher@example.com</b> / <b>teach123</b></p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
