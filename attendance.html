<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <title>Attendance - Campus Connect</title>
</head>
<body>
<div class="container py-4">
  <h1>Attendance</h1>
  <p><a href="/dashboard" class="btn btn-sm btn-outline-secondary mb-2">← Back to Dashboard</a></p>
  <p>Select a subject and mark attendance for students.</p>

  <div class="row g-2 mb-3">
    <div class="col-md-6">
      <label class="form-label">Subject</label>
      <select id="subjectSelect" class="form-select">
        <option th:each="s : ${subjects}" th:value="${s.id}" th:text="${s.name}"></option>
      </select>
    </div>
    <div class="col-md-6">
      <label class="form-label">Date</label>
      <input type="date" id="dateSelect" class="form-control" value=""/>
    </div>
  </div>

  <table class="table table-striped">
    <thead>
      <tr><th>Student</th><th>Present</th><th>Action</th></tr>
    </thead>
    <tbody>
      <tr th:each="st : ${students}">
        <td th:text="${st.name}"></td>
        <td>
          <input type="checkbox" class="presentCheckbox" th:data-student="${st.id}" th:disabled="${!isTeacher}"/>
        </td>
        <td>
          <button class="btn btn-sm btn-primary markBtn" th:data-student="${st.id}" th:if="${isTeacher}">Mark</button>
          <span th:unless="${isTeacher}" class="text-muted">(view only)</span>
        </td>
      </tr>
    </tbody>
  </table>

  <div id="status" class="mt-3"></div>

  <div class="card mt-4">
    <div class="card-body">
      <h5>Attendance History</h5>
      <canvas id="attendanceChart" height="100"></canvas>
    </div>
  </div>
</div>

<script>
  // chart setup
  let attendanceChart;
  function renderAttendanceChart(labels, data) {
    const ctx = document.getElementById('attendanceChart').getContext('2d');
    if (attendanceChart) attendanceChart.destroy();
    attendanceChart = new Chart(ctx, {
      type: 'line',
      data: { labels: labels, datasets: [{ label: 'Present', data: data, borderColor: '#0d6efd', tension: 0.3 }] },
      options: { responsive: true }
    });
  }

  async function postCheckin(subjectId, studentId, present) {
    const params = new URLSearchParams({subjectId, studentId, present});
    const res = await fetch('/api/attendance/checkin', {method:'POST', headers:{'Content-Type':'application/x-www-form-urlencoded'}, body: params});
    return res.json();
  }

  document.querySelectorAll('.markBtn').forEach(btn => btn.addEventListener('click', async (e)=>{
    const studentId = btn.getAttribute('data-student');
    const subjectId = document.getElementById('subjectSelect').value;
    const checkbox = document.querySelector('.presentCheckbox[data-student="'+studentId+'"]');
    const present = checkbox.checked;
    const r = await postCheckin(subjectId, studentId, present);
    document.getElementById('status').innerText = `Subject ${r.subjectId} attendance: ${r.presentCount}`;
    // refresh chart
    loadHistory(subjectId);
  }));

  async function loadHistory(subjectId) {
    const res = await fetch('/api/attendance/history?subjectId=' + encodeURIComponent(subjectId));
    const j = await res.json();
    const history = j.history || {};
    const labels = Object.keys(history);
    const data = labels.map(d => history[d]);
    renderAttendanceChart(labels, data);
  }

  document.getElementById('subjectSelect').addEventListener('change', (e)=>{ loadHistory(e.target.value); });

  // set default date and load chart for selected subject
  document.addEventListener('DOMContentLoaded', ()=>{
    const today = new Date().toISOString().slice(0,10);
    document.getElementById('dateSelect').value = today;
    const sel = document.getElementById('subjectSelect');
    if (sel && sel.value) loadHistory(sel.value);
  });
</script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</body>
</html>
