<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
		<title>Events & Booking</title>
		<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
		<style>
				body { padding: 1.5rem; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial; }
		</style>
</head>
<body>
		<div class="container">
			<h2>Events</h2>
			<table class="table table-striped">
				<thead>
					<tr><th>Title</th><th>Date</th><th>Action</th></tr>
				</thead>
				<tbody>
					<tr th:each="ev : ${events}">
						<td th:text="${ev.title}">Event title</td>
						<td th:text="${ev.date}">Date</td>
						<td>
							<form action="/book" method="post" style="display:inline">
								<input type="hidden" name="eventId" th:value="${ev.id}" />
								<button type="submit" class="btn btn-sm btn-primary">Book</button>
							</form>
						</td>
					</tr>
				</tbody>
			</table>

			<h3>Your Bookings (session)</h3>
			<ul class="list-group mb-3">
				<li class="list-group-item" th:each="b : ${bookings}" th:text="${b.eventTitle}">Booked event</li>
				<li class="list-group-item" th:if="${#lists.isEmpty(bookings)}">No bookings yet.</li>
			</ul>

			<p><a href="/" class="btn btn-outline-secondary">Back to Dashboard</a></p>
		</div>
		<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
