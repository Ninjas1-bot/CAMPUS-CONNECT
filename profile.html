<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Profile</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body{ font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial; padding:2rem; }
    .card { max-width:720px; margin:0 auto; }
  </style>
</head>
<body>
  <div class="card shadow-sm">
    <div class="card-body">
      <h4 class="card-title">Profile</h4>
      <table class="table table-borderless">
        <tr><th>Name</th><td th:text="${student.name}">Name</td></tr>
        <tr><th>Department</th><td th:text="${student.department}">Department</td></tr>
        <tr><th>Registration #</th><td th:text="${student.registrationNumber}">REG</td></tr>
        <tr><th>Email</th><td th:text="${student.email}">email</td></tr>
        <tr><th>Phone</th><td th:text="${student.phone}">phone</td></tr>
      </table>
      <p><a href="/dashboard" class="btn btn-outline-primary">Back to Dashboard</a></p>
    </div>
  </div>
</body>
</html>
