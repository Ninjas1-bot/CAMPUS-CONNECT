<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <title>CGPA Calculator</title>
</head>
<body>
<div class="container py-4">
  <h1>CGPA Calculator</h1>
  <p><a href="/dashboard" class="btn btn-sm btn-outline-secondary mb-2">← Back to Dashboard</a></p>
  <p>Add courses, credits and grade points (scale 0-10). The CGPA updates live.</p>
  <table class="table table-bordered" id="coursesTable">
    <thead><tr><th>Course</th><th>Credits</th><th>Grade</th><th></th></tr></thead>
    <tbody>
      <tr>
        <td><input class="form-control" value="Java Basics"/></td>
        <td><input class="form-control credit" value="3"/></td>
        <td><input class="form-control grade" value="8.5"/></td>
        <td><button class="btn btn-sm btn-danger remove">Remove</button></td>
      </tr>
      <tr>
        <td><input class="form-control" value="Data Structures"/></td>
        <td><input class="form-control credit" value="4"/></td>
        <td><input class="form-control grade" value="7.0"/></td>
        <td><button class="btn btn-sm btn-danger remove">Remove</button></td>
      </tr>
    </tbody>
  </table>
  <div class="mb-3">
    <button id="addRow" class="btn btn-outline-primary btn-sm">Add Course</button>
  </div>
  <div class="mt-3">
    <h3>CGPA: <span id="result" class="fs-4">-</span></h3>
  </div>
  <div class="card mt-3">
    <div class="card-body">
      <h5>Grades Overview</h5>
      <canvas id="gradesChart" height="80"></canvas>
    </div>
  </div>
</div>

<script>
  function computeCGPA() {
    const rows = Array.from(document.querySelectorAll('#coursesTable tbody tr'));
    let totalCredits = 0, weighted = 0;
    const labels = [], data = [];
    for (const r of rows) {
      const course = r.querySelector('input').value || 'Course';
      const c = parseFloat(r.querySelector('.credit').value) || 0;
      const g = parseFloat(r.querySelector('.grade').value) || 0;
      if (c>0) { totalCredits += c; weighted += c * g; labels.push(course); data.push(g); }
    }
    const cgpa = totalCredits? (weighted/totalCredits).toFixed(2): '-';
    document.getElementById('result').innerText = cgpa;
    renderGradesChart(labels, data);
  }

  function renderGradesChart(labels, data) {
    const ctx = document.getElementById('gradesChart').getContext('2d');
    if (window.gradesChart) window.gradesChart.destroy();
    window.gradesChart = new Chart(ctx, { type: 'bar', data: { labels, datasets:[{label:'Grade', data, backgroundColor:'#0d6efd'}] }, options:{responsive:true, scales:{y:{beginAtZero:true, max:10}}} });
  }

  document.getElementById('addRow').addEventListener('click', ()=>{
    const tbody = document.querySelector('#coursesTable tbody');
    const tr = document.createElement('tr');
    tr.innerHTML = `<td><input class="form-control" value="New Course"/></td><td><input class="form-control credit" value="3"/></td><td><input class="form-control grade" value="8"/></td><td><button class="btn btn-sm btn-danger remove">Remove</button></td>`;
    tbody.appendChild(tr);
    attachRowHandlers(tr);
    computeCGPA();
  });

  function attachRowHandlers(tr) {
    tr.querySelectorAll('input').forEach(inp => inp.addEventListener('input', computeCGPA));
    tr.querySelector('.remove').addEventListener('click', ()=>{ tr.remove(); computeCGPA(); });
  }

  document.querySelectorAll('#coursesTable tbody tr').forEach(r=>attachRowHandlers(r));
  computeCGPA();
</script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</body>
</html>
