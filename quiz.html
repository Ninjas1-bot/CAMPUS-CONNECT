<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width,initial-scale=1">
	<title>Java Quiz</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
	<style>
		body{ font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial; padding:2rem; }
		.card { max-width:800px; margin:0 auto; }
		.option-label { display:block; padding:.5rem; border-radius:.4rem; border:1px solid transparent; }
		.option-label input { margin-right:.75rem; }
		.option-label:hover { background:#f8f9fa; border-color:#e9ecef; }
	</style>
</head>
<body>
	<div class="card shadow-sm">
		<div class="card-body">
			<h4 class="card-title">Java Quiz</h4>
			<p class="text-muted" th:text="${question.text}">Question text</p>
			<form action="/quiz-submit" method="post">
				<div class="mb-3" th:each="entry : ${question.options}">
					<label class="option-label">
						<input type="radio" name="answer" th:value="${entry.key}" required />
						<strong th:text="${entry.key}">A</strong>
						<span th:text="' - ' + ${entry.value}">Option text</span>
					</label>
				</div>
				<div class="d-flex gap-2">
					<button type="submit" class="btn btn-primary">Submit</button>
					<a href="/dashboard" class="btn btn-outline-secondary">Cancel</a>
				</div>
			</form>
		</div>
	</div>
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
