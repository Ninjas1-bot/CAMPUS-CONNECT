<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <title>Teacher Login</title>
</head>
<body class="bg-light">
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-4">
      <div class="card shadow-sm">
        <div class="card-body">
          <h5 class="card-title">Teacher Login</h5>
          <form method="post" action="/teacher/login">
            <div class="mb-2">
              <label class="form-label">Email</label>
              <input name="email" class="form-control" placeholder="teacher@example.com" required />
            </div>
            <div class="mb-2">
              <label class="form-label">Password</label>
              <input name="password" type="password" class="form-control" placeholder="teach123" required />
            </div>
            <button class="btn btn-warning w-100">Login as Teacher</button>
          </form>
          <div class="mt-3 small text-muted">Demo creds: teacher@example.com / teach123</div>
        </div>
      </div>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
