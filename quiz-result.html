<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width,initial-scale=1">
	<title>Quiz Result</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
	<style>
		body{ font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial; padding:2rem; }
		.result-card { max-width:720px; margin:0 auto; }
	</style>
</head>
<body>
	<div class="card result-card shadow-sm">
		<div class="card-body text-center">
			<h3>Quiz Result</h3>
			<div class="my-3">
				<span class="display-6" th:text="${score}">0</span>
				<span class="text-muted">/</span>
				<span class="h5 text-muted" th:text="${total}">1</span>
			</div>

			<div th:switch="${score}">
				<div th:case="${total}">
					<div class="alert alert-success">Perfect score — phenomenal work! 🎉</div>
				</div>
				<div th:case="*" th:if="${score >= (total * 0.7)}">
					<div class="alert alert-info">Great job — you're doing well. Keep practicing to perfect it!</div>
				</div>
				<div th:case="*" th:if="${score < (total * 0.7)}">
					<div class="alert alert-warning">Nice attempt — review the highlighted areas and try again. You've got this!</div>
				</div>
			</div>

			<div th:if="${score != total}" class="mt-2">Correct answer: <strong th:text="${correctKey}">A</strong></div>

			<div class="mt-4">
				<a href="/quiz" class="btn btn-primary">Retry Quiz</a>
				<a href="/dashboard" class="btn btn-outline-secondary">Back to Dashboard</a>
			</div>
		</div>
	</div>
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
